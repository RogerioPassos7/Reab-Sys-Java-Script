<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#349469" />
        <title>Perfil | ReabSYS</title>
        <link rel="icon" href="../assets/images/logo/ReabSYS_iconeBranco.png" />
        <link rel="stylesheet" href="../css/app.css" />
        <script src="../js/store.js" defer></script>
        <script src="../js/auth.js" defer></script>
        <script src="../js/ui.js" defer></script>
        <script src="../js/charts.js" defer></script>
        <script src="../js/patient.js" defer></script>
    </head>
    <body data-role="patient" data-patient-page="perfil">
        <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
        <aside class="app-sidebar" data-navigation></aside>
        <main class="app-main" id="main-content">
            <header class="page-header">
                <div>
                    <p class="eyebrow" id="patient-greeting">
                        Área do paciente
                    </p>
                    <h1>Perfil</h1>
                    <p class="page-description">
                        Seus dados de acompanhamento.
                    </p>
                </div>
            </header>
            <noscript
                >Ative o JavaScript para utilizar as funcionalidades.</noscript
            >
            <p id="app-error" class="error-message" role="alert" hidden></p>
            <section class="panel profile-panel">
                <h2 id="patient-profile-name"></h2>
                <p id="patient-profile-email"></p>
                <p id="patient-profile-condition" class="form-help"></p>
                <button
                    id="logout"
                    class="button button-secondary"
                    type="button"
                >
                    Sair
                </button>
            </section>
        </main>
        <div
            id="app-toast"
            class="toast"
            role="status"
            aria-live="polite"
            aria-atomic="true"
            hidden
        ></div>
    </body>
</html>
