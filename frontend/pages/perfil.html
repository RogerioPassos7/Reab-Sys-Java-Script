<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3a9468">
    <title>Perfil | ReabSYS</title>
    <link rel="icon" type="image/png" href="../assets/images/logo/ReabSYS_iconeBranco.png">
    <link rel="stylesheet" href="../css/app.css">
    <script src="../js/store.js" defer></script>
    <script src="../js/ui.js" defer></script>
    <script src="../js/profile.js" defer></script>
</head>
<body data-page="profile">
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <aside class="app-sidebar" data-navigation></aside>
    <main class="app-main" id="main-content">
        <header class="page-header"><div><p class="eyebrow">Acompanhamento fisioterapêutico</p><h1>Perfil</h1><p class="page-description">Seus dados de apresentação neste navegador.</p></div></header>
        <noscript><p class="error-message">Ative o JavaScript para utilizar as funcionalidades.</p></noscript>
        <p id="app-error" class="error-message" role="alert" hidden></p>
        <section class="panel profile-panel"><h2>Dados do fisioterapeuta</h2><form id="profile-form">
 <div class="field"><label for="profile-name">Nome *</label><input id="profile-name" name="name" required minlength="3" maxlength="100" autocomplete="name"></div>
 <div class="field"><label for="profile-email">E-mail *</label><input id="profile-email" name="email" type="email" required maxlength="120" autocomplete="email"></div>
 <div class="field"><label for="profile-registration">CREFITO</label><input id="profile-registration" name="registration" maxlength="30"></div>
 <button class="button button-primary" type="submit">Salvar perfil</button>
 </form></section>
    </main>
    <div id="app-toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
</body>
</html>
